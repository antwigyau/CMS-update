<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The link carries a one-time token in the query string; keep it out of
         referrers entirely. -->
    <meta name="referrer" content="no-referrer" />
    <title>Set a new password · Church Manager</title>

    <script src="/assets/js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>

  <body class="auth-layout">
    <main class="auth-card">
      <div class="auth-card__brand">
        <span class="app-brand__mark"
          ><i class="bi bi-house-heart-fill" aria-hidden="true"></i
        ></span>
        <span class="app-brand">Church Manager</span>
      </div>

      <h1 class="auth-card__title">Set a new password</h1>
      <p class="auth-card__subtitle">
        Choose a password of at least 12 characters. A short phrase works well.
      </p>

      <div id="reset-alert" hidden></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label class="field__label" for="password">
            New password <span class="field__required" aria-hidden="true">*</span>
          </label>
          <input
            class="form-control"
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            aria-describedby="password-error"
          />
          <p class="field__error" id="password-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="confirm">
            Confirm new password <span class="field__required" aria-hidden="true">*</span>
          </label>
          <input
            class="form-control"
            id="confirm"
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
            aria-describedby="confirm-error"
          />
          <p class="field__error" id="confirm-error" hidden></p>
        </div>

        <button class="btn btn-primary w-100" id="reset-submit" type="submit">
          <span id="reset-submit-label">Set new password</span>
        </button>
      </form>

      <p class="auth-card__footer"><a href="/">Back to sign in</a></p>
    </main>

    <script type="module" src="/assets/js/pages/reset-password.js"></script>
  </body>
</html>
